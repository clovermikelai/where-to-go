<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>該去哪 · Where To Go</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="application-name" content="Where To Go">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="該去哪">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="./css/app.css?v=6">
</head>
<body>

<div id="map" aria-label="地圖"></div>

<header class="topbar">
  <h1>🌍 該去哪</h1>
  <div class="topbar-actions">
    <button id="btn-explore" class="icon-btn" aria-label="探索模式" title="探索模式">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
    <button id="btn-favorites" class="icon-btn" aria-label="收藏清單" title="收藏清單">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span id="fav-count" class="badge" hidden>0</span>
    </button>
    <button id="btn-filters" class="icon-btn" aria-label="篩選" title="篩選">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
    </button>
  </div>
</header>

<div id="onboard-tip" class="onboard-tip" hidden role="dialog" aria-label="新手提示">
  <div class="onboard-title">想探索特定國家？</div>
  <div class="onboard-desc">點右上角的 <span class="onboard-key">🔍</span>，再點地圖上任何一個國家，就會即時抓那個國家的景點。</div>
  <button class="onboard-close" id="btn-onboard-close">知道了</button>
</div>

<div id="explore-banner" class="explore-banner" hidden>
  <span id="explore-banner-text">點擊地圖上的國家，從該國抓即時景點</span>
  <button class="banner-close icon-btn" id="btn-exit-explore" aria-label="離開探索模式">✕</button>
</div>

<button id="btn-throw" class="dart-btn" aria-label="射飛鏢">
  <span class="dart-emoji">🎯</span>
  <span class="dart-label">射飛鏢</span>
</button>

<aside id="filter-panel" class="panel" aria-hidden="true">
  <div class="panel-head">
    <h2>篩選條件</h2>
    <button class="icon-btn" data-close-panel aria-label="關閉">✕</button>
  </div>
  <div class="panel-body">
    <section>
      <label class="field-label">區域</label>
      <div class="chip-group" id="filter-region"></div>
    </section>
    <section>
      <label class="field-label">類型</label>
      <div class="chip-group" id="filter-type"></div>
    </section>
    <section>
      <label class="field-label">距離</label>
      <div class="chip-group" id="filter-distance">
        <button class="chip" data-distance="any" aria-pressed="true">不限</button>
        <button class="chip" data-distance="100">100 km 內</button>
        <button class="chip" data-distance="500">500 km 內</button>
        <button class="chip" data-distance="2000">2000 km 內</button>
      </div>
      <p class="hint" id="geo-hint">距離篩選需要你的位置授權。</p>
    </section>
    <section class="meta-section">
      <p class="hint" id="filter-count">符合條件：— 個地點</p>
    </section>
  </div>
</aside>

<aside id="favorites-panel" class="panel" aria-hidden="true">
  <div class="panel-head">
    <h2>我的收藏</h2>
    <button class="icon-btn" data-close-panel aria-label="關閉">✕</button>
  </div>
  <div class="panel-body">
    <ul id="favorites-list" class="fav-list"></ul>
    <p id="favorites-empty" class="hint">尚未收藏任何地點。射飛鏢命中後可以加入收藏。</p>
  </div>
</aside>

<div id="result-card" class="result-card" aria-hidden="true">
  <button class="card-close icon-btn" id="btn-close-card" aria-label="關閉">✕</button>
  <div class="card-image" id="card-image"><span class="card-image-fallback">📍</span></div>
  <div class="card-body">
    <div class="card-eyebrow" id="card-eyebrow">—</div>
    <h2 class="card-title" id="card-title">—</h2>
    <p class="card-subtitle" id="card-subtitle">—</p>
    <p class="card-extract" id="card-extract">載入介紹中…</p>
    <div class="card-actions">
      <button class="btn primary" id="btn-throw-again">🎯 再丟一次</button>
      <button class="btn" id="btn-fav-toggle">☆ 收藏</button>
      <button class="btn" id="btn-share">↗ 分享</button>
      <a class="btn" id="btn-open-map" target="_blank" rel="noopener">🗺 在地圖開啟</a>
    </div>
  </div>
</div>

<div id="dart-overlay" class="dart-overlay" aria-hidden="true">
  <div class="dart-flying">🎯</div>
  <div class="dart-text">瞄準中…</div>
</div>

<div id="toast" class="toast" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="./js/app.js?v=6"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
